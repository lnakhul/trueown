services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/trueown
      # Local-dev default only; override via shell/.env. Admin is disabled if empty.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin}
      # Optional: set both (shell or .env) to use hosted Supabase Auth + anon-role inserts.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      WATCHPACK_POLLING: "true"
    volumes:
      # Bind-mount source for hot reload; keep container-installed deps/build cache.
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trueown
    volumes:
      - db_data:/var/lib/postgresql/data
      # Scripts run once on first init, in lexical order: migrations, then seed.
      - ./supabase/migrations/20261017000000_init_core_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./supabase/migrations/20261018000000_admin_vetting.sql:/docker-entrypoint-initdb.d/02_admin_vetting.sql:ro
      - ./supabase/migrations/20261019000000_02_rls_policies.sql:/docker-entrypoint-initdb.d/03_rls_policies.sql:ro
      - ./supabase/migrations/20261020000000_neighborhood_boundaries.sql:/docker-entrypoint-initdb.d/04_neighborhood_boundaries.sql:ro
      - ./supabase/migrations/20261021000000_reputable_news_source.sql:/docker-entrypoint-initdb.d/05_reputable_news_source.sql:ro
      - ./supabase/migrations/20261022000000_brand_financial_backers.sql:/docker-entrypoint-initdb.d/06_brand_financial_backers.sql:ro
      - ./supabase/migrations/20261023000000_03_regional_markets.sql:/docker-entrypoint-initdb.d/07_regional_markets.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/08_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trueown"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
