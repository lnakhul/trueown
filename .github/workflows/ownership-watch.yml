# Weekly ownership-change watch: checks every brand on the map against news (GDELT)
# and SEC filings, and queues possible changes on the admin Alerts page.
# Nothing on a listing changes until an admin reviews it.
#
# Setup (repository Settings → Secrets and variables → Actions):
#   WATCH_DATABASE_URL       the Supabase session-pooler connection string
#   OWNERSHIP_WATCH_CONTACT  a contact email (the SEC requires one for automated requests)
# Without both secrets the job does nothing. Run it by hand from the Actions tab.
name: Ownership watch

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Check at most this many brands (blank = all due)"
        required: false

permissions:
  contents: read

concurrency:
  group: ownership-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.WATCH_DATABASE_URL }}
      OWNERSHIP_WATCH_CONTACT: ${{ secrets.OWNERSHIP_WATCH_CONTACT }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$OWNERSHIP_WATCH_CONTACT" ]; then
            echo "WATCH_DATABASE_URL or OWNERSHIP_WATCH_CONTACT is not set; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.config.outputs.enabled == 'true'
      - name: Watch for ownership changes
        if: steps.config.outputs.enabled == 'true'
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$LIMIT" ]; then
            npm run -s db:watch:ownership -- --yes --limit "$LIMIT"
          else
            npm run -s db:watch:ownership -- --yes
          fi
