name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trueown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trueown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trueown
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply migrations and seed
        run: |
          for file in supabase/migrations/*.sql supabase/seed.sql; do
            psql -h localhost -U postgres -d trueown -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Load neighborhood boundaries (committed NTA 2020 file, no network)
        run: npm run db:import:boundaries
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          ADMIN_PASSWORD: ci-build-only
